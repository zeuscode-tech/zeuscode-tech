<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Iskhak — Full-stack Developer and AI Automation">
  <style>
    .fade{opacity:0;animation:fade .8s ease forwards}.f1{animation-delay:.15s}.f2{animation-delay:.35s}.f3{animation-delay:.55s}
    .dash{stroke-dasharray:8 10;animation:dash 18s linear infinite}.orbit{transform-origin:690px 142px;animation:spin 18s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite alternate}
    @keyframes fade{to{opacity:1}}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes float{to{transform:translateY(-8px)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="1" stop-color="#10182c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6366f1" stop-opacity=".32"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="card"><rect width="880" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#bg)"/><rect width="880" height="300" fill="url(#grid)"/>
    <circle cx="700" cy="140" r="150" fill="url(#glow)" filter="url(#blur)"/>
    <path class="dash" d="M-20 250C180 165 310 328 510 220S760 78 930 128" fill="none" stroke="url(#accent)" stroke-opacity=".28" stroke-width="1.5"/>
    <g class="orbit" fill="none" stroke-linecap="round">
      <ellipse cx="690" cy="142" rx="116" ry="78" stroke="#67e8f9" stroke-opacity=".23"/>
      <ellipse cx="690" cy="142" rx="82" ry="116" stroke="#a78bfa" stroke-opacity=".18" transform="rotate(52 690 142)"/>
      <circle cx="806" cy="142" r="5" fill="#67e8f9" stroke="none"/><circle cx="690" cy="64" r="4" fill="#c084fc" stroke="none"/>
    </g>
    <g class="float">
      <rect x="642" y="94" width="96" height="96" rx="24" fill="#101827" stroke="url(#accent)" stroke-width="2"/>
      <path d="M670 162V122h9v40zm18 0v-40h9v40zm18 0v-40h9v40" fill="url(#accent)"/>
      <path d="M661 171h58" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="fade f1">
      <rect x="48" y="50" width="184" height="28" rx="14" fill="#67e8f9" fill-opacity=".1" stroke="#67e8f9" stroke-opacity=".42"/>
      <circle cx="64" cy="64" r="4" fill="#34d399" class="pulse"/><text x="76" y="69" fill="#bae6fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.6">AVAILABLE TO BUILD</text>
    </g>
    <text class="fade f2" x="48" y="144" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Iskhak</text>
    <rect class="fade f2" x="48" y="161" width="386" height="4" rx="2" fill="url(#accent)"/>
    <text class="fade f3" x="48" y="203" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2.1">FULL-STACK DEVELOPER · AI AUTOMATION</text>
    <text class="fade f3" x="48" y="238" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">backend / frontend / mobile / intelligent workflows</text>
    <g opacity=".65"><circle cx="48" cy="270" r="3" fill="#67e8f9"/><path d="M60 270h92" stroke="#334155"/><circle cx="164" cy="270" r="3" fill="#818cf8"/><path d="M176 270h92" stroke="#334155"/><circle cx="280" cy="270" r="3" fill="#c084fc"/></g>
  </g>
  <rect x=".75" y=".75" width="878.5" height="298.5" rx="17.25" fill="none" stroke="#27344f" stroke-width="1.5"/>
</svg>
