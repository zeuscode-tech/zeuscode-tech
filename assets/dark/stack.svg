<svg xmlns="http://www.w3.org/2000/svg" width="880" height="286" viewBox="0 0 880 286" role="img" aria-label="Technology stack">
  <style>.chip{opacity:0;animation:pop .45s cubic-bezier(.2,1.25,.4,1) forwards}.c1{animation-delay:.18s}.c2{animation-delay:.26s}.c3{animation-delay:.34s}.c4{animation-delay:.42s}.c5{animation-delay:.5s}.c6{animation-delay:.58s}.c7{animation-delay:.66s}.c8{animation-delay:.74s}.c9{animation-delay:.82s}.c10{animation-delay:.9s}@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.scan{animation:scan 5s ease-in-out infinite alternate}@keyframes scan{to{transform:translateX(210px)}}</style>
